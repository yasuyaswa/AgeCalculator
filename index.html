<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Age Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Beautiful age calculator – find your exact age in years, months, days, hours, minutes and seconds." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Animated background orbs (CSS only – GitHub Pages safe) -->
<div class="bg-orbs" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
</div>

<div class="wrapper">
  <div class="card" id="capture">

    <!-- Header -->
    <div class="card-header">
      <div class="header-icon">🎂</div>
      <h1>Age Calculator</h1>
      <p class="subtitle">Discover your exact age to the second</p>
    </div>

    <!-- Inputs -->
    <div class="form-section">
      <div class="input-group">
        <span class="input-icon">👤</span>
        <input type="text" id="name" placeholder="Your name (optional)" autocomplete="off" />
      </div>

      <div class="input-group">
        <span class="input-icon">📅</span>
        <input type="datetime-local" id="dob" aria-label="Date and time of birth" />
      </div>

      <button class="primary-btn" onclick="start()" aria-label="Calculate age">
        <span>Calculate My Age</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>

    <!-- Result section -->
    <div class="result-section hidden" id="resultSection">

      <div class="divider"></div>

      <!-- Name greeting -->
      <div class="name-display hidden" id="nameDisplay"></div>

      <!-- Zodiac + born-day chips -->
      <div class="fun-row" id="funRow">
        <div class="fun-chip" id="zodiacChip"></div>
        <div class="fun-chip" id="bornDayChip"></div>
      </div>

      <!-- Age tiles: Years spans 2 cols -->
      <div class="tiles" id="tiles">
        <div class="tile tile-years">
          <div class="tile-value" id="years">0</div>
          <div class="tile-label">Years</div>
        </div>
        <div class="tile tile-months">
          <div class="tile-value" id="months">0</div>
          <div class="tile-label">Months</div>
        </div>
        <div class="tile tile-days">
          <div class="tile-value" id="days">0</div>
          <div class="tile-label">Days</div>
        </div>
        <div class="tile tile-hours">
          <div class="tile-value" id="hours">0</div>
          <div class="tile-label">Hours</div>
        </div>
        <div class="tile tile-minutes">
          <div class="tile-value" id="minutes">0</div>
          <div class="tile-label">Minutes</div>
        </div>
        <div class="tile tile-seconds">
          <div class="tile-value" id="seconds">0</div>
          <div class="tile-label">Seconds</div>
        </div>
      </div>

      <!-- Total days banner -->
      <div class="total-days" id="totalDays"></div>

      <!-- Next birthday card -->
      <div class="birthday-card" id="birthday">
        <div class="birthday-header">
          <span>🎉</span>
          <span class="birthday-label">Next Birthday</span>
        </div>
        <div class="birthday-time" id="nextBirthday"></div>
        <div class="progress-track">
          <div class="progress-bar" id="birthdayProgress"></div>
        </div>
        <div class="progress-label" id="progressLabel"></div>
      </div>

    </div>
  </div>

  <!-- Export button (outside card so it doesn't appear in the export) -->
  <button class="export-btn hidden" id="exportBtn" onclick="exportImage()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Export as Image
  </button>

  <footer class="site-footer">Built with <span class="heart">&#9829;</span> for GitHub Pages</footer>
</div>

<!-- Confetti canvas (shown only on birthday) -->
<canvas id="confettiCanvas" aria-hidden="true"></canvas>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="script.js"></script>
</body>
</html>
